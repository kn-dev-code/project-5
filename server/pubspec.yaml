publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.1

dependencies:
  football_core:
    path: ../packages/football_core
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  http: ^1.5.0
  lints: ^6.0.0
  test: ^1.26.0
