name: 🛠 Android CI / Build & Release APK

on:
  push:
    branches: [main, master, upgrade]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master, upgrade]

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 🔄 Reset Flutter state
        run: |
          flutter clean
          flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: ✅ Test shared package
        working-directory: packages/football_core
        run: |
          dart pub get
          dart test

      - name: ✅ Test server
        working-directory: server
        run: |
          dart pub get
          dart test

      # Set the API_URL repository variable to the server's https address.
      # Without it the APK runs its own on-device server with made-up games.
      - name: 🏗️ Build APKs
        run: flutter build apk --release --no-tree-shake-icons --dart-define=API_URL=${{ vars.API_URL }}

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
